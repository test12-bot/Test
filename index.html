<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25CED1">
  <meta name="description" content="HIGHWAY Delivery — لوحة تحكم التاجر">
  <title>HIGHWAY — لوحة التاجر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<div class="phone">

  <!-- ================= 1. الرأس ================= -->
  <header class="header">
    <div class="store-logo" aria-hidden="true">ن</div>
    <div class="store-info">
      <strong id="storeName">حلويات نفيسة</strong>
      <small><span class="live-dot"></span> متصل · <span id="storeLoc">السرو</span></small>
    </div>
    <button class="hdr-btn" id="notifBtn" aria-label="الإشعارات">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="badge" id="notifBadge">2</span>
    </button>
    <button class="hdr-btn" id="accountBtn" aria-label="الحساب">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    </button>
  </header>

  <!-- ================= 2. ملخص اليوم ================= -->
  <article class="summary" id="summary">
    <div class="summary-head">
      <span>📊 ملخص اليوم</span>
      <span id="todayDate">الأربعاء ٢٢ أكتوبر</span>
    </div>
    <div class="summary-grid">
      <div class="summary-stat">
        <strong id="statCount">5</strong>
        <small>توصيلات</small>
      </div>
      <div class="summary-stat">
        <strong><span id="statCost">18.50</span><small>د.أ</small></strong>
        <small>تكلفة التوصيل</small>
      </div>
      <div class="summary-stat">
        <strong><span id="statReceived">12.00</span><small>د.أ</small></strong>
        <small>مستلم</small>
      </div>
    </div>
  </article>

  <!-- ================= 3. زر استدعاء كابتن ================= -->
  <button class="call-btn" id="callBtn">
    <span class="ico" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6M14 17V9h-3M19 9l-3-4h-4v4"/></svg>
    </span>
    <span class="txt">
      <strong>استدعاء كابتن</strong>
      <small>يصل خلال دقيقة · توصيل فوري</small>
    </span>
    <span class="arrow" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </span>
  </button>

  <!-- ================= 4. قيد التوصيل ================= -->
  <section class="section">
    <div class="section-head">
      <h2>قيد التوصيل <span class="count" id="activeCount">2</span></h2>
      <button class="see-all" id="historyBtn">السجل ←</button>
    </div>
    <div id="deliveriesList"></div>
  </section>

  <!-- ================= 5. أدوات سريعة ================= -->
  <section class="section">
    <div class="section-head">
      <h2>أدوات سريعة</h2>
    </div>
    <div class="quick-grid">
      <button class="quick" data-action="prices">
        <span class="quick-ico teal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 10h6M9 14h6"/></svg>
        </span>
        <span class="quick-txt"><strong>قائمة الأسعار</strong><small>مناطق السلط وعمان</small></span>
      </button>

      <button class="quick" data-action="addresses">
        <span class="quick-ico yellow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        </span>
        <span class="quick-txt"><strong>عناوين محفوظة</strong><small>٣٤ عميل دائم</small></span>
      </button>

      <button class="quick" data-action="history">
        <span class="quick-ico blue">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5"/></svg>
        </span>
        <span class="quick-txt"><strong>سجل الطلبات</strong><small>هذا الشهر: ٨٩ طلب</small></span>
      </button>

      <button class="quick" data-action="contact">
        <span class="quick-ico rose">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="quick-txt"><strong>تواصل معنا</strong><small>دعم مباشر ٢٤/٧</small></span>
      </button>
    </div>
  </section>

</div>

<!-- ================= 6. الشريط السفلي ================= -->
<nav class="nav">
  <button class="nav-btn active" data-nav="home">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
    <span>الرئيسية</span>
  </button>
  <button class="nav-btn" data-nav="orders">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
    <span>الطلبات</span>
  </button>
  <button class="nav-btn" data-nav="account">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
    <span>حسابي</span>
  </button>
</nav>

<!-- ================= 7. نافذة استدعاء كابتن (Bottom Sheet) ================= -->
<div class="modal" id="callModal" aria-hidden="true">
  <div class="modal-backdrop" data-close="callModal"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="callModalTitle">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <h3 id="callModalTitle">استدعاء كابتن جديد</h3>
      <button class="sheet-close" data-close="callModal" aria-label="إغلاق">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <form id="callForm" novalidate>
      <label class="field">
        <span>اسم العميل</span>
        <input type="text" id="custName" placeholder="مثال: أحمد العمري" required>
        <em class="err" data-for="custName"></em>
      </label>

      <label class="field">
        <span>عنوان التوصيل</span>
        <input type="text" id="custAddress" placeholder="المنطقة · علامة مميزة" required>
        <em class="err" data-for="custAddress"></em>
      </label>

      <div class="field-row">
        <label class="field">
          <span>قيمة الطلب <em class="opt">(اختياري)</em></span>
          <input type="number" id="orderValue" placeholder="0.00" min="0" step="0.01">
        </label>
        <label class="field">
          <span>سعر التوصيل</span>
          <input type="number" id="deliveryFee" value="1.50" min="1.50" step="0.01">
        </label>
      </div>

      <label class="field">
        <span>ملاحظات <em class="opt">(اختياري)</em></span>
        <textarea id="custNotes" rows="2" placeholder="مثال: بجانب الصيدلية، الطابق الثاني"></textarea>
      </label>

      <div class="sheet-actions">
        <button type="button" class="btn-ghost" data-close="callModal">إلغاء</button>
        <button type="submit" class="btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="17" r="3"/><circle cx="18" cy="17" r="3"/><path d="M9 17h6M14 17V9h-3M19 9l-3-4h-4v4"/></svg>
          استدعاء الآن
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ================= 8. نافذة التتبع ================= -->
<div class="modal" id="trackModal" aria-hidden="true">
  <div class="modal-backdrop" data-close="trackModal"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="trackTitle">
    <div class="sheet-handle"></div>

    <div class="sheet-head">
      <h3 id="trackTitle">تتبع التوصيل</h3>
      <button class="sheet-close" data-close="trackModal" aria-label="إغلاق">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div id="trackContent"></div>
  </div>
</div>

<!-- ================= 9. Toast ================= -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="dashboard.js"></script>
</body>
</html>
